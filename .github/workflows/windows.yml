name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python build_windows.py
      - name: Test packaged MCP
        shell: pwsh
        run: |
          $env:CANVASLINK_TEST_EXE = (Resolve-Path 'dist/CanvasLink/CanvasLink.exe').Path
          python -m unittest discover -s tests -p test_mcp.py -v
      - run: python release.py
      - uses: actions/upload-artifact@v4
        with:
          name: CanvasLink-windows-x64
          path: releases/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CanvasLink-windows-x64
          path: release-assets
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
          fi
